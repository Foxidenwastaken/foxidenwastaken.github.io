<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Google Fish</title>
<style>
:root{--bg:#e8f4fd;--ink:#202124;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b2233;--ink:#e8eaed;--card:#12324a}}
:root[data-theme="dark"]{--bg:#0b2233;--ink:#e8eaed;--card:#12324a}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Product Sans","Google Sans",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#hud{display:flex;gap:24px;font-size:20px;font-weight:600;padding:6px}
#wrap{position:relative;width:min(96vw,900px);flex:1;max-height:600px;margin-bottom:8px}
canvas{width:100%;height:100%;border-radius:16px;background:linear-gradient(#7fd0ff,#1a73e8);touch-action:none;display:block}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:#fff;background:rgba(0,30,70,.55);border-radius:16px;padding:16px}
#msg h1{margin:0;font-size:clamp(28px,6vw,48px)}
#msg h1 span:nth-child(6n+1){color:#8ab4f8}#msg h1 span:nth-child(6n+2){color:#f28b82}#msg h1 span:nth-child(6n+3){color:#fdd663}#msg h1 span:nth-child(6n+4){color:#8ab4f8}#msg h1 span:nth-child(6n+5){color:#81c995}#msg h1 span:nth-child(6n){color:#f28b82}
button{font:inherit;font-weight:600;background:#fff;color:#1a73e8;border:0;border-radius:24px;padding:12px 28px;cursor:pointer;font-size:18px}
button:focus-visible{outline:3px solid #fdd663}
</style>
</head>
<body>
<div id="hud"><span>Score: <b id="sc">0</b></span><span>Size: <b id="sz">1</b></span><span>Best: <b id="bs">0</b></span></div>
<div id="wrap"><canvas id="c"></canvas>
<div id="msg"><h1><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span> Fish</h1><p>Move your mouse or finger to swim.<br>Eat smaller fish. Avoid bigger ones.</p><button id="go">Play</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
const COL=['#4285f4','#ea4335','#fbbc04','#34a853'];
let W,H,fish,me,mouse,score,best=0,running=false;
try{best=+localStorage.getItem('fishbest')||0}catch(e){}
document.getElementById('bs').textContent=best;
function resize(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height}
addEventListener('resize',resize);resize();
function spawn(){
  const s=Math.max(8,me.r*(0.4+Math.random()*1.5)),left=Math.random()<.5;
  fish.push({x:left?-s*2:W+s*2,y:Math.random()*H,r:s,vx:(left?1:-1)*(0.8+Math.random()*1.6),c:COL[Math.random()*4|0],t:Math.random()*6});
}
function start(){
  me={x:W/2,y:H/2,r:14,c:'#fdd663',vx:1};mouse={x:W/2,y:H/2};fish=[];score=0;running=true;
  msg.style.display='none';upd();for(let i=0;i<8;i++){spawn();fish[i].x=Math.random()*W}
}
function upd(){sc.textContent=score;sz.textContent=Math.round(me.r-13)}
function drawFish(f,dir){
  const{x,y,r,c}=f,w=Math.sin((f.t||0))*.25;
  ctx.save();ctx.translate(x,y);ctx.scale(dir,1);
  ctx.fillStyle=c;
  ctx.beginPath();ctx.ellipse(0,0,r*1.3,r*.85,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-r*1.1,0);ctx.lineTo(-r*2.1,-r*(.7+w));ctx.lineTo(-r*2.1,r*(.7-w));ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(r*.6,-r*.2,r*.28,0,7);ctx.fill();
  ctx.fillStyle='#202124';ctx.beginPath();ctx.arc(r*.68,-r*.2,r*.13,0,7);ctx.fill();
  ctx.restore();
}
function end(){
  running=false;if(score>best){best=score;bs.textContent=best;try{localStorage.setItem('fishbest',best)}catch(e){}}
  msg.innerHTML='<h1>Eaten!</h1><p>You scored '+score+'.</p><button id="go">Play again</button>';
  msg.style.display='flex';document.getElementById('go').onclick=start;
}
function tick(){
  requestAnimationFrame(tick);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let i=0;i<6;i++){ctx.beginPath();ctx.arc((i*173+Date.now()/40)%W,H-((i*97+Date.now()/25)%H),4+i,0,7);ctx.fill()}
  if(!running){fish&&fish.forEach(f=>drawFish(f,f.vx>0?1:-1));return}
  const dx=mouse.x-me.x,dy=mouse.y-me.y,d=Math.hypot(dx,dy);
  if(d>4){const sp=Math.min(d*.08,5);me.x+=dx/d*sp;me.y+=dy/d*sp;if(Math.abs(dx)>3)me.vx=dx>0?1:-1}
  for(let i=fish.length-1;i>=0;i--){
    const f=fish[i];f.x+=f.vx;f.t+=.2;
    if(f.x<-f.r*4||f.x>W+f.r*4){fish.splice(i,1);continue}
    if(Math.hypot(f.x-me.x,f.y-me.y)<(f.r+me.r)*.9){
      if(me.r>f.r){me.r+=f.r*.08+.4;score+=Math.round(f.r);fish.splice(i,1);upd()}
      else{end();return}
    }
  }
  while(fish.length<9+Math.min(6,score/60|0))spawn();
  fish.forEach(f=>{
    ctx.globalAlpha=1;drawFish(f,f.vx>0?1:-1);
    if(f.r>=me.r){ctx.strokeStyle='rgba(234,67,53,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(f.x,f.y,f.r*1.4,f.r*.95,0,0,7);ctx.stroke()}
  });
  drawFish(me,me.vx);
}
function move(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;mouse={x:p.clientX-r.left,y:p.clientY-r.top}}
cv.addEventListener('mousemove',move);cv.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});cv.addEventListener('touchstart',move);
document.getElementById('go').onclick=start;
fish=[];tick();
</script>
</body>
</html>
